name: trading-engine

# One long job per NSE session (engine/session.py) runs the bots every 5 min, instead of relying on
# GitHub's best-effort cron for every run. The crons below only need ONE of them to fire each
# morning; later ones are backups that restart the session if it died. If a session is already
# running, a backup trigger just waits in the queue and exits immediately after the close.
on:
  schedule:
    - cron: "7,22,37,52 3 * * 1-5"   # 08:37 - 09:22 IST: start the session (pre-open)
    - cron: "17 4-9 * * 1-5"         # hourly backups through the day
    - cron: "48 10 * * 1-5"          # 16:18 IST: catch-up leaderboard summary
  workflow_dispatch:
    inputs:
      mode:
        description: "session = run all day; once = single run"
        type: choice
        options: [once, session]
        default: once
      only:
        description: "Comma-separated bot names (blank = all, 'once' mode only)"
        required: false
      force:
        description: "Run now even if market closed / bar not due ('once' mode only)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets a session hand over to its successor before the 6h job limit

concurrency:
  group: trading-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LIVE_WEBHOOK_URL: ${{ secrets.LIVE_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

      - name: Market session (every 5 min until the close)
        if: github.event_name == 'schedule' || inputs.mode == 'session'
        run: python -u -m engine.session

      - name: Single run
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'session'
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python -m engine.run "$@"
          python - <<'EOF'
          from engine.session import save_state
          save_state("manual run")
          EOF
