name: trading-engine

on:
  schedule:
    # NSE session 09:15-15:30 IST = 03:45-10:00 UTC, every 15 min (+15:45 IST for the daily summary)
    - cron: "45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"
    # 24/7 markets (crypto) - hourly
    - cron: "5 * * * *"
  push:
    branches: [main]
    paths: ["signals/inbox/**"]   # new external signal -> act on it right away
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated bot names (blank = all)"
        required: false
      force:
        description: "Run now even if market closed / bar not due"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_WEBHOOK_URL: ${{ secrets.LIVE_WEBHOOK_URL }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python -m engine.run "$@"

      - name: Save state
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -A state signals STATUS.md dashboard
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "engine run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q -X theirs origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
