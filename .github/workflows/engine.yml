name: trading-engine

on:
  schedule:
    # GitHub drops scheduled runs at busy minutes (:00/:15/:30/:45 and the top of the hour),
    # so every trigger sits on an odd minute. Runs are idempotent: an extra run does nothing twice.
    # NSE only (session 09:15-15:30 IST = 03:45-10:00 UTC), every 10 min. ~41 runs/day x 22 days
    # = ~900 of the 2,000 free minutes/month. Crypto bots are checked on these same runs.
    - cron: "47,57 3 * * 1-5"               # 09:17, 09:27 IST
    - cron: "2,12,22,32,42,52 4-9 * * 1-5"  # 09:32 ... 15:22 IST (15:22 = intraday square-off)
    - cron: "57 9 * * 1-5"                  # 15:27 IST backup square-off
    - cron: "8,38 10 * * 1-5"               # 15:38 / 16:08 IST daily leaderboard summary
  push:
    branches: [main]
    paths: ["signals/inbox/**"]   # new external signal -> act on it right away
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated bot names (blank = all)"
        required: false
      force:
        description: "Run now even if market closed / bar not due"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_WEBHOOK_URL: ${{ secrets.LIVE_WEBHOOK_URL }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python -m engine.run "$@"

      - name: Save state
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -A state signals STATUS.md dashboard
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "engine run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q -X theirs origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
