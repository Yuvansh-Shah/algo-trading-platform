name: trading-engine

# Started from outside: cron-job.org calls this workflow's dispatch API every 5 min, 09:00-15:55 IST,
# Mon-Fri (mode=once). GitHub's own `schedule` trigger is NOT used: it delivered runs hours late
# or not at all, so the bots never ran in market hours.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "session = run all day; once = single run"
        type: choice
        options: [once, session]
        default: once
      only:
        description: "Comma-separated bot names (blank = all, 'once' mode only)"
        required: false
      force:
        description: "Run now even if market closed / bar not due ('once' mode only)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets a session hand over to its successor before the 6h job limit

concurrency:
  group: trading-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LIVE_WEBHOOK_URL: ${{ secrets.LIVE_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

      - name: Market session (every 5 min until the close)
        if: inputs.mode == 'session'
        run: python -u -m engine.session

      - name: Single run
        if: inputs.mode != 'session'
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python -m engine.run "$@"
          python - <<'EOF'
          from engine.session import save_state
          save_state("manual run")
          EOF
